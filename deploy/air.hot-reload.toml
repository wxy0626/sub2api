root = "/workspace/sub2api/backend"
tmp_dir = "/tmp/sub2api-air"

[build]
  cmd = "go build -tags embed -ldflags='-X main.Version=local-0.1.168-3' -o /tmp/sub2api-air/server ./cmd/server"
  bin = "/tmp/sub2api-air/server"
  include_ext = ["go", "sql"]
  exclude_dir = [".git", "bin", "tmp"]
  delay = 300
  poll = true
  poll_interval = 500
  stop_on_error = true

[log]
  time = true

[misc]
  clean_on_exit = true
